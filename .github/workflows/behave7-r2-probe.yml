name: Behave 7 Rothermel reference regression

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/behave7-r2-probe.yml"

permissions:
  contents: read

jobs:
  reference-cases:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pinned Behave 7 app
        uses: actions/checkout@v4
        with:
          repository: firelab/behave-app
          ref: a3cfcd5903188d73445948af16644868225bb9d5
          path: behave-app
          submodules: false
          persist-credentials: false

      - name: Check out pinned Behave core submodule
        uses: actions/checkout@v4
        with:
          repository: firelab/behave
          ref: 29888c7ad364aa18cfb340f4c25a8e395f24260f
          path: behave-app/behave-lib/behave-mirror
          persist-credentials: false

      - name: Increase upstream test output precision only
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("behave-app/behave-lib/test/cpp/testSurface.cpp")
          source = path.read_text()
          needle = "int main(int argc, char * argv[])\n{\n"
          replacement = needle + "  std::cout << std::setprecision(17);\n"
          if needle not in source:
              raise SystemExit("Could not locate testSurface main() for precision-only patch")
          path.write_text(source.replace(needle, replacement, 1))
          PY

      - name: Build pinned Behave library and official testSurface
        run: |
          cmake \
            -S behave-app/behave-lib \
            -B behave-build \
            -DTEST_BEHAVE=ON \
            -DBEHAVE_WASM=OFF \
            -DBEHAVE_JS=OFF \
            -DBEHAVE_HTML=OFF
          cmake --build behave-build --target behave testSurface --parallel 2

      - name: Verify pinned FM1 dead-only base reference
        shell: bash
        run: |
          cat > fm1_zero_wind_zero_slope.csv <<'CSV'
          fuelModelNumber,moistureOneHour,moistureTenHour,moistureHundredHour,moistureLiveHerbaceous,moistureLiveWoody,moistureUnits,slope,slopeUnits,aspect,windAndSpreadOrientationMode,windSpeed,windSpeedUnits,windHeightInputMode,windDirection,canopyCover,canopyCoverUnits,canopyHeight,canopyHeightUnits,crownRatio,spreadRate
          1,5.0,5.0,5.0,100.0,100.0,"Percent",0,"Percent",0,"RelativeToUpslope",0,"FeetPerMinute","DirectMidflame",0,0,"Percent",0.0,"Feet",0.0,4.4262698923571939
          CSV

          echo "Pinned Behave app commit: a3cfcd5903188d73445948af16644868225bb9d5"
          echo "Pinned behave core commit: 29888c7ad364aa18cfb340f4c25a8e395f24260f"
          echo "Official testSurface source is changed only to print additional precision."
          ./behave-build/testSurface fm1_zero_wind_zero_slope.csv | tee behave7_fm1_reference.log
          grep -q "Total tests passed: 1" behave7_fm1_reference.log
          grep -q "Total tests failed: 0" behave7_fm1_reference.log

      - name: Verify pinned FM2 static live-fuel base reference
        shell: bash
        run: |
          cat > fm2_zero_wind_zero_slope.csv <<'CSV'
          fuelModelNumber,moistureOneHour,moistureTenHour,moistureHundredHour,moistureLiveHerbaceous,moistureLiveWoody,moistureUnits,slope,slopeUnits,aspect,windAndSpreadOrientationMode,windSpeed,windSpeedUnits,windHeightInputMode,windDirection,canopyCover,canopyCoverUnits,canopyHeight,canopyHeightUnits,crownRatio,spreadRate
          2,5.0,5.0,5.0,100.0,100.0,"Percent",0,"Percent",0,"RelativeToUpslope",0,"FeetPerMinute","DirectMidflame",0,0,"Percent",0.0,"Feet",0.0,2.3810521029916596
          CSV

          ./behave-build/testSurface fm2_zero_wind_zero_slope.csv | tee behave7_fm2_reference.log
          grep -q "Total tests passed: 1" behave7_fm2_reference.log
          grep -q "Total tests failed: 0" behave7_fm2_reference.log

      - name: Verify pinned FM1 slope-only reference
        shell: bash
        run: |
          cat > fm1_slope_only.csv <<'CSV'
          fuelModelNumber,moistureOneHour,moistureTenHour,moistureHundredHour,moistureLiveHerbaceous,moistureLiveWoody,moistureUnits,slope,slopeUnits,aspect,windAndSpreadOrientationMode,windSpeed,windSpeedUnits,windHeightInputMode,windDirection,canopyCover,canopyCoverUnits,canopyHeight,canopyHeightUnits,crownRatio,spreadRate
          1,5.0,5.0,5.0,100.0,100.0,"Percent",30,"Percent",0,"RelativeToUpslope",0,"FeetPerMinute","DirectMidflame",0,0,"Percent",0.0,"Feet",0.0,20.817222076028628
          CSV

          ./behave-build/testSurface fm1_slope_only.csv | tee behave7_fm1_slope_reference.log
          grep -q "Total tests passed: 1" behave7_fm1_slope_reference.log
          grep -q "Total tests failed: 0" behave7_fm1_slope_reference.log

      - name: Verify pinned FM1 wind-only reference
        shell: bash
        run: |
          cat > fm1_wind_only.csv <<'CSV'
          fuelModelNumber,moistureOneHour,moistureTenHour,moistureHundredHour,moistureLiveHerbaceous,moistureLiveWoody,moistureUnits,slope,slopeUnits,aspect,windAndSpreadOrientationMode,windSpeed,windSpeedUnits,windHeightInputMode,windDirection,canopyCover,canopyCoverUnits,canopyHeight,canopyHeightUnits,crownRatio,spreadRate
          1,5.0,5.0,5.0,100.0,100.0,"Percent",0,"Percent",0,"RelativeToUpslope",100,"FeetPerMinute","DirectMidflame",0,0,"Percent",0.0,"Feet",0.0,8.834274755440232
          CSV

          ./behave-build/testSurface fm1_wind_only.csv | tee behave7_fm1_wind_reference.log
          grep -q "Total tests passed: 1" behave7_fm1_wind_reference.log
          grep -q "Total tests failed: 0" behave7_fm1_wind_reference.log

      - name: Add explicit wind-limit probe as an upstream-CMake target
        shell: bash
        run: |
          cat > behave-app/behave-lib/windLimitProbe.cpp <<'CPP'
          #include <iomanip>
          #include <iostream>
          #include "behaveRun.h"
          #include "fuelModels.h"

          int main()
          {
              FuelModels fuelModels;
              SpeciesMasterTable mortalitySpeciesTable;
              BehaveRun behaveRun(fuelModels, mortalitySpeciesTable);

              behaveRun.surface.updateSurfaceInputs(
                  1,
                  5.0,
                  5.0,
                  5.0,
                  100.0,
                  100.0,
                  FractionUnits::Percent,
                  1000.0,
                  SpeedUnits::FeetPerMinute,
                  WindHeightInputMode::DirectMidflame,
                  0.0,
                  WindAndSpreadOrientationMode::RelativeToUpslope,
                  0.0,
                  SlopeUnits::Percent,
                  0.0,
                  0.0,
                  FractionUnits::Percent,
                  0.0,
                  LengthUnits::Feet,
                  0.0,
                  FractionUnits::Fraction);

              behaveRun.surface.setIsWindLimitEnabled(true);
              behaveRun.surface.doSurfaceRunInDirectionOfMaxSpread();

              std::cout << std::setprecision(17)
                        << behaveRun.surface.getSpreadRate(SpeedUnits::ChainsPerHour)
                        << "\n";
              return 0;
          }
          CPP

          cat >> behave-app/behave-lib/CMakeLists.txt <<'CMAKE'

          add_executable(windLimitProbe windLimitProbe.cpp)
          target_link_libraries(windLimitProbe PRIVATE behave)
          CMAKE

          cmake \
            -S behave-app/behave-lib \
            -B behave-build \
            -DTEST_BEHAVE=ON \
            -DBEHAVE_WASM=OFF \
            -DBEHAVE_JS=OFF \
            -DBEHAVE_HTML=OFF

      - name: Build explicit wind-limit probe
        id: build_wind_probe
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cmake --build behave-build --target windLimitProbe --parallel 2 2>&1 | tee wind_probe_build.log

      - name: Upload wind-limit probe build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: behave-wind-limit-build-log
          path: wind_probe_build.log
          if-no-files-found: error

      - name: Require successful wind-limit probe build
        if: steps.build_wind_probe.outcome == 'failure'
        run: exit 1

      - name: Run explicit wind-limit probe
        shell: bash
        run: |
          {
            echo "behave_app_commit=a3cfcd5903188d73445948af16644868225bb9d5"
            echo "behave_core_commit=29888c7ad364aa18cfb340f4c25a8e395f24260f"
            echo "case=FM1 dead moisture 5/5/5%; slope 0%; direct-midflame wind 1000 ft/min; wind limit enabled"
            printf "spread_rate_chains_h="
            ./behave-build/windLimitProbe
          } | tee behave_wind_limit_probe.txt

      - name: Upload wind-limit probe result
        uses: actions/upload-artifact@v4
        with:
          name: behave-wind-limit-probe
          path: behave_wind_limit_probe.txt
          if-no-files-found: error
