name: Behave 7 Rothermel reference regression

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/behave7-r2-probe.yml"

permissions:
  contents: read

jobs:
  reference-cases:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pinned Behave 7 app
        uses: actions/checkout@v4
        with:
          repository: firelab/behave-app
          ref: a3cfcd5903188d73445948af16644868225bb9d5
          path: behave-app
          submodules: false
          persist-credentials: false

      - name: Check out pinned Behave core submodule
        uses: actions/checkout@v4
        with:
          repository: firelab/behave
          ref: 29888c7ad364aa18cfb340f4c25a8e395f24260f
          path: behave-app/behave-lib/behave-mirror
          persist-credentials: false

      - name: Patch test harness for precision and one explicit wind-limit case
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("behave-app/behave-lib/test/cpp/testSurface.cpp")
          source = path.read_text()

          main_needle = "int main(int argc, char * argv[])\n{\n"
          main_replacement = main_needle + "  std::cout << std::setprecision(17);\n"
          if main_needle not in source:
              raise SystemExit("Could not locate testSurface main() for precision-only patch")
          source = source.replace(main_needle, main_replacement, 1)

          run_needle = "  // Perform Run\n  behaveRun.surface.doSurfaceRunInDirectionOfMaxSpread();"
          run_replacement = """  // Enable the optional operational wind limit only for the dedicated
          // 1000 ft/min reference row. Scientific equation/core sources remain unchanged.
          behaveRun.surface.setIsWindLimitEnabled(inputs.windSpeed == 1000.0);

          // Perform Run
          behaveRun.surface.doSurfaceRunInDirectionOfMaxSpread();"""
          if run_needle not in source:
              raise SystemExit("Could not locate testSurface run call for wind-limit harness patch")
          path.write_text(source.replace(run_needle, run_replacement, 1))
          PY

      - name: Build official testSurface executable
        run: |
          cmake \
            -S behave-app/behave-lib \
            -B behave-build \
            -DTEST_BEHAVE=ON \
            -DBEHAVE_WASM=OFF \
            -DBEHAVE_JS=OFF \
            -DBEHAVE_HTML=OFF
          cmake --build behave-build --target testSurface --parallel 2

      - name: Verify pinned FM1 dead-only base reference
        shell: bash
        run: |
          cat > fm1_zero_wind_zero_slope.csv <<'CSV'
          fuelModelNumber,moistureOneHour,moistureTenHour,moistureHundredHour,moistureLiveHerbaceous,moistureLiveWoody,moistureUnits,slope,slopeUnits,aspect,windAndSpreadOrientationMode,windSpeed,windSpeedUnits,windHeightInputMode,windDirection,canopyCover,canopyCoverUnits,canopyHeight,canopyHeightUnits,crownRatio,spreadRate
          1,5.0,5.0,5.0,100.0,100.0,"Percent",0,"Percent",0,"RelativeToUpslope",0,"FeetPerMinute","DirectMidflame",0,0,"Percent",0.0,"Feet",0.0,4.4262698923571939
          CSV

          echo "Pinned Behave app commit: a3cfcd5903188d73445948af16644868225bb9d5"
          echo "Pinned behave core commit: 29888c7ad364aa18cfb340f4c25a8e395f24260f"
          echo "Harness patch changes output precision and enables wind limit only for 1000 ft/min row."
          ./behave-build/testSurface fm1_zero_wind_zero_slope.csv | tee behave7_fm1_reference.log
          grep -q "Total tests passed: 1" behave7_fm1_reference.log
          grep -q "Total tests failed: 0" behave7_fm1_reference.log

      - name: Verify pinned FM2 static live-fuel base reference
        shell: bash
        run: |
          cat > fm2_zero_wind_zero_slope.csv <<'CSV'
          fuelModelNumber,moistureOneHour,moistureTenHour,moistureHundredHour,moistureLiveHerbaceous,moistureLiveWoody,moistureUnits,slope,slopeUnits,aspect,windAndSpreadOrientationMode,windSpeed,windSpeedUnits,windHeightInputMode,windDirection,canopyCover,canopyCoverUnits,canopyHeight,canopyHeightUnits,crownRatio,spreadRate
          2,5.0,5.0,5.0,100.0,100.0,"Percent",0,"Percent",0,"RelativeToUpslope",0,"FeetPerMinute","DirectMidflame",0,0,"Percent",0.0,"Feet",0.0,2.3810521029916596
          CSV

          ./behave-build/testSurface fm2_zero_wind_zero_slope.csv | tee behave7_fm2_reference.log
          grep -q "Total tests passed: 1" behave7_fm2_reference.log
          grep -q "Total tests failed: 0" behave7_fm2_reference.log

      - name: Verify pinned FM1 slope-only reference
        shell: bash
        run: |
          cat > fm1_slope_only.csv <<'CSV'
          fuelModelNumber,moistureOneHour,moistureTenHour,moistureHundredHour,moistureLiveHerbaceous,moistureLiveWoody,moistureUnits,slope,slopeUnits,aspect,windAndSpreadOrientationMode,windSpeed,windSpeedUnits,windHeightInputMode,windDirection,canopyCover,canopyCoverUnits,canopyHeight,canopyHeightUnits,crownRatio,spreadRate
          1,5.0,5.0,5.0,100.0,100.0,"Percent",30,"Percent",0,"RelativeToUpslope",0,"FeetPerMinute","DirectMidflame",0,0,"Percent",0.0,"Feet",0.0,20.817222076028628
          CSV

          ./behave-build/testSurface fm1_slope_only.csv | tee behave7_fm1_slope_reference.log
          grep -q "Total tests passed: 1" behave7_fm1_slope_reference.log
          grep -q "Total tests failed: 0" behave7_fm1_slope_reference.log

      - name: Verify pinned FM1 wind-only reference
        shell: bash
        run: |
          cat > fm1_wind_only.csv <<'CSV'
          fuelModelNumber,moistureOneHour,moistureTenHour,moistureHundredHour,moistureLiveHerbaceous,moistureLiveWoody,moistureUnits,slope,slopeUnits,aspect,windAndSpreadOrientationMode,windSpeed,windSpeedUnits,windHeightInputMode,windDirection,canopyCover,canopyCoverUnits,canopyHeight,canopyHeightUnits,crownRatio,spreadRate
          1,5.0,5.0,5.0,100.0,100.0,"Percent",0,"Percent",0,"RelativeToUpslope",100,"FeetPerMinute","DirectMidflame",0,0,"Percent",0.0,"Feet",0.0,8.834274755440232
          CSV

          ./behave-build/testSurface fm1_wind_only.csv | tee behave7_fm1_wind_reference.log
          grep -q "Total tests passed: 1" behave7_fm1_wind_reference.log
          grep -q "Total tests failed: 0" behave7_fm1_wind_reference.log

      - name: Verify pinned FM1 explicit wind-limit reference
        shell: bash
        run: |
          cat > fm1_wind_limit.csv <<'CSV'
          fuelModelNumber,moistureOneHour,moistureTenHour,moistureHundredHour,moistureLiveHerbaceous,moistureLiveWoody,moistureUnits,slope,slopeUnits,aspect,windAndSpreadOrientationMode,windSpeed,windSpeedUnits,windHeightInputMode,windDirection,canopyCover,canopyCoverUnits,canopyHeight,canopyHeightUnits,crownRatio,spreadRate
          1,5.0,5.0,5.0,100.0,100.0,"Percent",0,"Percent",0,"RelativeToUpslope",1000,"FeetPerMinute","DirectMidflame",0,0,"Percent",0.0,"Feet",0.0,297.3264790473483
          CSV

          echo "FM1 wind-limit reference: 1000 ft/min direct-midflame wind; optional wind limit explicitly enabled by test harness."
          ./behave-build/testSurface fm1_wind_limit.csv | tee behave7_fm1_wind_limit_reference.log
          grep -q "Total tests passed: 1" behave7_fm1_wind_limit_reference.log
          grep -q "Total tests failed: 0" behave7_fm1_wind_limit_reference.log
