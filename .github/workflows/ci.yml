name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Tests
        run: pytest --cov=pyfireca --cov-report=term-missing

  test-python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: pytest

  gis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project with GIS support
        run: python -m pip install -e ".[dev,gis]"
      - name: Run GIS workflow tests
        run: |
          pytest \
            tests/test_gis.py \
            tests/test_rasterio_io.py \
            tests/test_output_rasterio.py \
            tests/test_workflow_rasterio.py \
            tests/test_cli_rasterio.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade build
          python -m build
          ls -lh dist/

      - name: Clean-install built wheel and exercise console script
        run: |
          python -m venv .venv-wheel
          . .venv-wheel/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          pyfireca --help
          python -c "import pyfireca; print(pyfireca.__version__)"

      - name: Clean-install built wheel with GIS extra
        run: |
          WHEEL=$(realpath dist/*.whl)
          python -m venv .venv-gis
          . .venv-gis/bin/activate
          python -m pip install --upgrade pip
          python -m pip install "pyfireca[gis] @ file://${WHEEL}"
          python -c "import pyfireca, rasterio; print(pyfireca.__version__, rasterio.__version__)"
