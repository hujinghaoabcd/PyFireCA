[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pyfireca"
version = "0.1.0a0"
description = "A modular and extensible cellular automata framework for wildfire spread simulation."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Jinghao Hu" },
]
keywords = [
  "wildfire",
  "cellular automata",
  "fire spread",
  "GIS",
  "geospatial",
  "Rothermel",
  "scientific computing",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/hujinghaoabcd/PyFireCA"
Repository = "https://github.com/hujinghaoabcd/PyFireCA"
Issues = "https://github.com/hujinghaoabcd/PyFireCA/issues"
Documentation = "https://github.com/hujinghaoabcd/PyFireCA/blob/main/docs/RUNNING_SIMULATOR.md"
Changelog = "https://github.com/hujinghaoabcd/PyFireCA/blob/main/CHANGELOG.md"

[project.scripts]
pyfireca = "pyfireca.cli:main"

[project.optional-dependencies]
gis = [
  "rasterio>=1.3",
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "pre-commit>=3.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pyfireca"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.coverage.run]
source = ["pyfireca"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/pyfireca/behavior/fbp.py" = ["SIM114"]

[tool.ruff.format]
docstring-code-format = true
